<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha conta | Passaporte Sul-Americano</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Instrument+Serif&amp;display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/app.js" defer></script>
</head>
<body>
  <header class="topo">
    <div class="limite barra">
      <a class="marca" href="../index.html">
        <img src="../img/logo.svg" width="24" height="28" alt="">
        The-Creators
      </a>

      <nav class="menu" aria-label="Menu principal">
        <a href="../../index.html">Início</a>
        <a href="minha_conta.html" aria-current="page">Minha conta</a>
        <a href="entrar.html" data-publico>Entrar</a>
        <a href="criar.html" data-publico>Criar conta</a>
      </nav>
    </div>
  </header>

  <main class="limite pagina-conta">
    <header class="abertura">
      <h1>Minha conta</h1>
    </header>

    <p id="mensagem" role="status"></p>

    <section class="cartao" aria-labelledby="titulo-dados-conta">
      <h2 id="titulo-dados-conta">Dados da conta</h2>

      <div class="perfil">
        <img id="conta-foto" src="../img/perfil.svg" width="72" height="72" alt="">

        <dl class="dados-conta">
          <dt>Nome</dt>
          <dd id="conta-nome">—</dd>

          <dt>Nome de usuário</dt>
          <dd id="conta-usuario">—</dd>

          <dt>E-mail</dt>
          <dd id="conta-email">—</dd>

          <dt>Biografia</dt>
          <dd id="conta-biografia">—</dd>

          <dt>Data de cadastro</dt>
          <dd id="conta-data-cadastro">—</dd>
        </dl>
      </div>

      <p class="secao-painel" id="conta-sem-sessao">
        <a href="./entrar.html">Entre na sua conta</a> para consultar seu perfil.
      </p>

      <button id="btn-sair" class="botao botao-link" type="button" hidden>Sair da conta</button>
    </section>

    <section class="cartao conta" aria-labelledby="titulo-viagens-conta">
      <h2 id="titulo-viagens-conta">Minhas viagens</h2>
      <ul id="lista-viagens-conta" class="lista-viagens">
        <li>Entre na sua conta para consultar suas viagens.</li>
      </ul>
      <a href="../index.html#mapa">Ver mapa</a>
    </section>
  </main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="464" height="508" viewBox="0 0 464 508" role="group" aria-labelledby="titulo">
  <title id="titulo">Mapa da América do Sul</title>
  <!-- Contornos simplificados a partir do Natural Earth. -->

  <style>
    .pais { cursor: pointer; }

    .contorno {
      fill: #bdd2aa;
      stroke: #f9fcf4;
      stroke-width: 1.4;
      stroke-linejoin: round;
    }

    .pais:nth-of-type(even) .contorno { fill: #a8c69f; }
    .pais:hover .contorno { filter: brightness(0.94); }

    .pais:focus-visible .contorno,
    .pais.selecionado .contorno {
      stroke: #173f32;
      stroke-width: 2.4;
    }

    .pais.visitado .contorno { fill: #ebc56e; }

    text {
      font-family: system-ui, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .sigla {
      font-size: 12px;
      font-weight: 700;
      fill: #214435;
    }

    .oceano {
      font: italic 19px Georgia, serif;
      fill: #4d6d62;
    }

    .linha-rotulo {
      fill: none;
      stroke: #577363;
      stroke-width: 1.1;
      pointer-events: none;
    }

    .estrela {
      display: none;
      font-size: 20px;
      fill: #7a4b00;
      stroke: #fffdf7;
      stroke-width: 2;
      paint-order: stroke;
    }

    .pais.visitado .estrela { display: block; }
  </style>

